<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="theme-color" content="#173b35"/>
<title>People Directory | IT112 Week 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav class="navbar navbar-dark">
	<div class="container nav-inner">
		<a class="navbar-brand" href="#">
			<span class="brand-mark" aria-hidden="true">W7</span>
			<span>IT112 <span class="brand-divider">/</span> Week 7</span>
		</a>
		<span class="nav-badge"><span class="status-dot"></span> FULL STACK LAB</span>
	</div>
</nav>

<main class="container page-shell">
	<header class="page-intro">
		<p class="eyebrow">YOUR WORKSPACE <span></span> PEOPLE</p>
		<h1>People directory</h1>
		<p class="intro-copy">Keep your people details together, tidy, and easy to find.</p>
	</header>

	<div class="row g-4 directory-layout">
		<section class="col-lg-5" aria-labelledby="add-user-title">
			<div class="panel-card form-panel">
				<div class="section-heading">
					<span class="section-index">01</span>
					<div>
						<p class="section-kicker">NEW ENTRY</p>
						<h2 id="add-user-title" class="card-title">Add a person</h2>
					</div>
				</div>
				<form id="userForm" class="user-form">
					<div class="field-group">
						<label class="form-label" for="userName">Full name</label>
						<input id="userName" class="form-control" name="name" placeholder="e.g. Jordan Lee" autocomplete="name" required>
					</div>
					<div class="field-group">
						<label class="form-label" for="userEmail">Email address</label>
						<input id="userEmail" class="form-control" name="email" type="email" placeholder="jordan@example.com" autocomplete="email" required>
					</div>
					<div class="field-group field-group-last">
						<label class="form-label" for="userAge">Age <span class="optional-label">OPTIONAL</span></label>
						<input id="userAge" class="form-control" name="age" type="number" min="1" placeholder="Leave blank if not needed">
					</div>
					<button class="btn save-btn" type="submit"><span>Add to directory</span><span class="button-arrow" aria-hidden="true">&#8594;</span></button>
				</form>
				<div id="msg" class="message-area" aria-live="polite"></div>
			</div>
		</section>

		<section class="col-lg-7" aria-labelledby="user-list-title">
			<div class="panel-card directory-panel">
				<div class="directory-heading">
					<div class="section-heading">
						<span class="section-index section-index-coral">02</span>
						<div>
							<p class="section-kicker">YOUR CONTACTS</p>
							<h2 id="user-list-title" class="card-title">User list</h2>
						</div>
					</div>
					<span id="userCount" class="user-count" aria-live="polite">0 users</span>
				</div>
				<label class="visually-hidden" for="searchInput">Search people</label>
				<div class="search-wrap">
					<span class="search-symbol" aria-hidden="true"></span>
					<input id="searchInput" class="form-control search-input" type="search" placeholder="Search by name or email..." autocomplete="off">
					<span class="search-hint" aria-hidden="true">FIND</span>
				</div>
				<div id="userList" class="list-group user-list" aria-live="polite"></div>
			</div>
		</section>
	</div>
	<footer class="page-footer"><span class="footer-line"></span><span>IT112 <span class="footer-dot">/</span> WEEK 7 MINI APP</span></footer>
</main>

<script src="/js/app.js"></script>
</body>
</html>
